<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 코드 스토리지 매니저</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .editor-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            font-weight: 600;
        }

        .editor-container {
            position: relative;
        }

        .code-textarea {
            width: 100%;
            height: 350px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            resize: vertical;
            display: none;
        }

        .code-textarea.active {
            display: block;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* 저장된 목록 스타일 */
        .history-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .folder-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .folder-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .folder-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .folder-actions button {
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .folder-actions .btn-load {
            color: var(--primary-color);
            border-color: var(--primary-color);
            margin-right: 0.5rem;
        }

        .folder-actions .btn-load:hover {
            background-color: rgba(79, 70, 229, 0.05);
        }

        .folder-actions .btn-delete {
            color: #ef4444;
            border-color: #ef4444;
        }

        .folder-actions .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Code Storage Manager</h1>
        <p>프로젝트별로 index.html, script.js, style.css 코드를 브라우저에 저장하세요.</p>
    </header>

    <div class="card">
        <!-- 폴더 이름 입력 -->
        <div class="form-group">
            <label for="folderName">프로젝트 폴더 이름</label>
            <input type="text" id="folderName" placeholder="예: my-awesome-project" autocomplete="off">
        </div>

        <!-- 에디터 탭 메뉴 -->
        <div class="editor-tabs">
            <button class="tab-btn active" onclick="switchTab('html')">index.html</button>
            <button class="tab-btn" onclick="switchTab('css')">style.css</button>
            <button class="tab-btn" onclick="switchTab('js')">script.js</button>
        </div>

        <!-- 코드 입력 영역 -->
        <div class="editor-container">
            <textarea id="codeHtml" class="code-textarea active" placeholder="<!-- HTML 코드를 입력하세요 -->&#10;<!DOCTYPE html>&#10;<html>...</html>"></textarea>
            <textarea id="codeCss" class="code-textarea" placeholder="/* CSS 코드를 입력하세요 */&#10;body { background: #fff; }"></textarea>
            <textarea id="codeJs" class="code-textarea" placeholder="// JavaScript 코드를 입력하세요&#10;console.log('Hello World');"></textarea>
        </div>

        <button class="btn-submit" onclick="saveToStorage()" style="margin-top: 1.5rem;">스토리지에 저장하기</button>
    </div>

    <!-- 저장된 폴더 목록 -->
    <div class="history-section">
        <h2>저장된 프로젝트 폴더 목록</h2>
        <div class="folder-list" id="folderList">
            <!-- 자바스크립트로 동적 생성됨 -->
        </div>
    </div>
</div>

<script>
    // 탭 전환 기능
    function switchTab(type) {
        // 모든 탭 버튼 및 텍스트 영역 비활성화
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.code-textarea').forEach(tx => tx.classList.remove('active'));

        // 선택한 영역 활성화
        if (type === 'html') {
            document.querySelector('button[onclick="switchTab(\'html\')"]').classList.add('active');
            document.getElementById('codeHtml').classList.add('active');
        } else if (type === 'css') {
            document.querySelector('button[onclick="switchTab(\'css\')"]').classList.add('active');
            document.getElementById('codeCss').classList.add('active');
        } else if (type === 'js') {
            document.querySelector('button[onclick="switchTab(\'js\')"]').classList.add('active');
            document.getElementById('codeJs').classList.add('active');
        }
    }

    // 로컬 스토리지 저장 기능
    function saveToStorage() {
        const folderName = document.getElementById('folderName').value.trim();
        const htmlContent = document.getElementById('codeHtml').value;
        const cssContent = document.getElementById('codeCss').value;
        const jsContent = document.getElementById('codeJs').value;

        if (!folderName) {
            alert('폴더 이름을 입력해 주세요.');
            document.getElementById('folderName').focus();
            return;
        }

        // 하나의 객체로 데이터 구조화
        const projectData = {
            folderName: folderName,
            updatedAt: new Date().toLocaleString(),
            files: {
                'index.html': htmlContent,
                'style.css': cssContent,
                'script.js': jsContent
            }
        };

        // 로컬 스토리지에 'code_project_[폴더명]' 키로 저장
        localStorage.setItem(`code_project_${folderName}`, JSON.stringify(projectData));
        
        alert(`'${folderName}' 폴더 내에 3개 파일이 안전하게 저장되었습니다.`);
        
        // 입력 폼 초기화 및 목록 갱신
        document.getElementById('folderName').value = '';
        document.getElementById('codeHtml').value = '';
        document.getElementById('codeCss').value = '';
        document.getElementById('codeJs').value = '';
        switchTab('html');
        
        renderFolderList();
    }

    // 저장된 폴더 리스트 불러와서 화면에 그리기
    function renderFolderList() {
        const folderListContainer = document.getElementById('folderList');
        folderListContainer.innerHTML = '';

        let hasItems = false;

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            
            // 본 프로그램에서 정의한 키 값만 필터링
            if (key.startsWith('code_project_')) {
                hasItems = true;
                const project = JSON.parse(localStorage.getItem(key));
                
                const folderCard = document.createElement('div');
                folderCard.className = 'folder-card';
                folderCard.innerHTML = `
                    <div class="folder-info">
                        <h3>📁 ${project.folderName}</h3>
                        <p>저장일: ${project.updatedAt}</p>
                    </div>
                    <div class="folder-actions">
                        <button class="btn-load" onclick="loadProject('${project.folderName}')">불러오기</button>
                        <button class="btn-delete" onclick="deleteProject('${project.folderName}')">삭제</button>
                    </div>
                `;
                folderListContainer.appendChild(folderCard);
            }
        }

        if (!hasItems) {
            folderListContainer.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 2rem;">저장된 폴더가 없습니다.</p>';
        }
    }

    // 특정 프로젝트 불러오기
    function loadProject(folderName) {
        const data = localStorage.getItem(`code_project_${folderName}`);
        if (!data) return;

        const project = JSON.parse(data);
        
        document.getElementById('folderName').value = project.folderName;
        document.getElementById('codeHtml').value = project.files['index.html'] || '';
        document.getElementById('codeCss').value = project.files['style.css'] || '';
        document.getElementById('codeJs').value = project.files['script.js'] || '';
        
        switchTab('html');
        alert(`'${folderName}' 프로젝트를 에디터로 불러왔습니다.`);
    }

    // 특정 프로젝트 삭제
    function deleteProject(folderName) {
        if (confirm(`'${folderName}' 프로젝트를 영구 삭제하시겠습니까?`)) {
            localStorage.removeItem(`code_project_${folderName}`);
            renderFolderList();
        }
    }

    // 페이지 로드 시 목록 자동 출력
    window.onload = renderFolderList;
</script>
</body>
</html>
