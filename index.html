<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 소스 파일 저장기</title>

<!-- ZIP 생성 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
:root{
  --primary:#10b981;
  --primaryHover:#059669;
  --bg:#f3f4f6;
  --card:#ffffff;
  --border:#d1d5db;
  --text:#111827;
  --muted:#6b7280;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

.container{
  max-width:1000px;
  margin:0 auto;
}

h1{
  text-align:center;
  color:var(--primary);
  margin-bottom:12px;
}

.sub-text{
  text-align:center;
  color:var(--muted);
  margin-bottom:24px;
  line-height:1.6;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.info{
  background:#ecfdf5;
  border-left:5px solid var(--primary);
  padding:16px;
  border-radius:10px;
  margin-bottom:20px;
  color:#065f46;
  line-height:1.7;
}

.input-wrap{
  margin-bottom:20px;
}

.input-wrap label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

.input-wrap input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:16px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.tab{
  flex:1;
  border:none;
  background:#e5e7eb;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.tab.active{
  background:var(--primary);
  color:white;
}

textarea{
  width:100%;
  height:420px;
  display:none;
  resize:vertical;
  border:none;
  border-radius:12px;
  padding:16px;
  background:#1e1e1e;
  color:#d4d4d4;
  font-size:14px;
  font-family:Consolas, monospace;
}

textarea.active{
  display:block;
}

.btn{
  width:100%;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.btn-smart{
  margin-top:18px;
  padding:18px;
  background:var(--primary);
  color:white;
  font-size:18px;
  font-weight:bold;
}

.btn-smart:hover{
  background:var(--primaryHover);
}

.btn-pc{
  margin-top:12px;
  padding:16px;
  background:white;
  color:var(--primaryHover);
  border:2px solid var(--primary);
  font-size:16px;
  font-weight:bold;
}

.status{
  margin-top:18px;
  background:#f9fafb;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Web Code Exporter</h1>

  <p class="sub-text">
    프로젝트별로 HTML, CSS, JavaScript 파일을 ZIP 또는 폴더 형태로 저장하세요.
  </p>

  <div class="card">

    <div class="info">
      <strong>사용 방법</strong><br><br>

      📱 스마트폰:<br>
      ZIP 파일로 다운로드 저장됩니다.<br><br>

      💻 PC Chrome / Edge:<br>
      선택한 위치에 새 프로젝트 폴더를 만들고<br>
      index.html / style.css / script.js 파일이 저장됩니다.
    </div>

    <div class="input-wrap">
      <label>프로젝트 폴더 이름</label>
      <input id="projectName" value="MyWebProject" placeholder="예: Liquid-GUI-App">
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('html', this)">index.html</button>
      <button class="tab" onclick="showTab('css', this)">style.css</button>
      <button class="tab" onclick="showTab('js', this)">script.js</button>
    </div>

<textarea id="htmlCode" class="active"><!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>안녕하세요!</h1>
  <p>파일 저장 테스트입니다.</p>

  <script src="script.js"></script>

</body>
</html></textarea>

<textarea id="cssCode">body{
  margin:0;
  padding:40px;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  color:#10b981;
}</textarea>

<textarea id="jsCode">console.log("script.js 연결 완료");

document.addEventListener("DOMContentLoaded",()=>{

  alert("앱이 정상 실행되었습니다.");

});</textarea>

    <button class="btn btn-smart" onclick="saveSmartphone()">
      📱 스마트폰용 ZIP 다운로드 저장
    </button>

    <button class="btn btn-pc" onclick="savePC()">
      💻 PC용 새 폴더 생성 후 저장
    </button>

    <div id="status" class="status">
      대기 중입니다.
    </div>

  </div>
</div>

<script>
function showTab(type, btn){

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.classList.remove("active");
  });

  document.querySelectorAll("textarea").forEach(area=>{
    area.classList.remove("active");
  });

  btn.classList.add("active");

  if(type==="html"){
    document.getElementById("htmlCode").classList.add("active");
  }

  if(type==="css"){
    document.getElementById("cssCode").classList.add("active");
  }

  if(type==="js"){
    document.getElementById("jsCode").classList.add("active");
  }
}

function cleanName(name){

  return name
    .trim()
    .replace(/[\\/:*?"<>|]/g,"-")
    .replace(/\s+/g,"_") || "MyWebProject";
}

function getProjectData(){

  return{
    projectName:cleanName(
      document.getElementById("projectName").value
    ),

    html:document.getElementById("htmlCode").value,

    css:document.getElementById("cssCode").value,

    js:document.getElementById("jsCode").value
  };
}

async function saveSmartphone(){

  const status=document.getElementById("status");

  try{

    status.textContent="ZIP 파일 생성 중입니다.";

    const data=getProjectData();

    const zip=new JSZip();

    const folder=zip.folder(data.projectName);

    folder.file("index.html",data.html);
    folder.file("style.css",data.css);
    folder.file("script.js",data.js);

    const blob=await zip.generateAsync({
      type:"blob"
    });

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download=data.projectName + ".zip";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },1000);

    status.textContent=
      "완료: ZIP 파일이 다운로드되었습니다. 파일 앱에서 압축을 해제하세요.";

  }catch(error){

    console.error(error);

    status.textContent=
      "오류: ZIP 저장 중 문제가 발생했습니다.";

    alert("ZIP 생성 실패");
  }
}

async function savePC(){

  const status=document.getElementById("status");

  if(!window.showDirectoryPicker){

    alert(
      "현재 브라우저는 폴더 직접 저장을 지원하지 않습니다.\n\n스마트폰에서는 ZIP 다운로드 버튼을 사용하세요."
    );

    return;
  }

  try{

    status.textContent=
      "부모 폴더를 선택하세요.";

    const data=getProjectData();

    const parentFolder=
      await window.showDirectoryPicker({
        mode:"readwrite"
      });

    status.textContent=
      "프로젝트 폴더 생성 중입니다.";

    const projectFolder=
      await parentFolder.getDirectoryHandle(
        data.projectName,
        {create:true}
      );

    status.textContent=
      "파일 저장 중입니다.";

    await writeFile(
      projectFolder,
      "index.html",
      data.html
    );

    await writeFile(
      projectFolder,
      "style.css",
      data.css
    );

    await writeFile(
      projectFolder,
      "script.js",
      data.js
    );

    status.textContent=
      "완료: 새 폴더와 3개 파일 저장이 완료되었습니다.";

    alert(
      "🎉 저장 완료!\n\n" +
      data.projectName +
      " 폴더 안에\n\n" +
      "- index.html\n" +
      "- style.css\n" +
      "- script.js\n\n" +
      "파일이 저장되었습니다."
    );

  }catch(error){

    console.error(error);

    if(error.name==="AbortError"){

      status.textContent=
        "사용자가 폴더 선택을 취소했습니다.";

    }else{

      status.textContent=
        "오류: 파일 저장 실패";

      alert(
        "파일 저장 중 오류가 발생했습니다."
      );
    }
  }
}

async function writeFile(
  folderHandle,
  fileName,
  content
){

  const fileHandle=
    await folderHandle.getFileHandle(
      fileName,
      {create:true}
    );

  const writable=
    await fileHandle.createWritable();

  await writable.write(content);

  await writable.close();
}
</script>

</body>
</html>
